<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b11">
  <title>Collega la TV · TubeTV</title><link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png?v=4"><link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=4">
  <style>
    :root{color-scheme:dark;--gold:#ffb703;--orange:#fb8500;--muted:#9da8b9}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#07090e;color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:22px;overflow-x:hidden}body:before{content:"";position:fixed;inset:-20%;background:radial-gradient(circle at 20% 20%,rgba(255,183,3,.15),transparent 28%),radial-gradient(circle at 84% 78%,rgba(38,91,255,.14),transparent 28%);pointer-events:none}.shell{position:relative;width:min(520px,100%)}.brand{display:flex;justify-content:center;align-items:center;gap:11px;font-size:24px;font-weight:950;letter-spacing:-.04em;margin-bottom:22px}.brand img{width:42px;height:42px;border-radius:12px}.brand em{font-style:normal;color:var(--gold)}.card{background:rgba(15,19,28,.9);border:1px solid rgba(255,255,255,.11);border-radius:30px;padding:28px;box-shadow:0 30px 90px rgba(0,0,0,.4);backdrop-filter:blur(22px);text-align:center}.tv-icon{width:82px;height:82px;margin:0 auto 18px;display:grid;place-items:center;border-radius:25px;background:linear-gradient(145deg,rgba(255,183,3,.18),rgba(251,133,0,.07));border:1px solid rgba(255,183,3,.24);color:#ffd166}.tv-icon svg{width:44px}h1{margin:0;font-size:30px;letter-spacing:-.04em}p{color:var(--muted);line-height:1.55;margin:10px 0 0}.code{display:inline-block;margin:22px 0 6px;padding:10px 18px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.045);border-radius:15px;font-size:25px;font-weight:950;letter-spacing:.18em}.account{margin:20px 0;padding:14px 16px;border-radius:17px;background:rgba(255,255,255,.04);text-align:left}.account strong,.account small{display:block}.account small{color:var(--muted);margin-top:4px}.button{width:100%;border:0;border-radius:17px;padding:15px 18px;background:linear-gradient(135deg,var(--gold),var(--orange));color:#181007;font:900 16px/1 system-ui;cursor:pointer;box-shadow:0 13px 35px rgba(251,133,0,.2)}.button:disabled{opacity:.55;cursor:wait}.secondary{margin-top:11px;background:rgba(255,255,255,.075);color:#fff;box-shadow:none}.status{margin-top:15px;min-height:22px;font-size:14px;color:var(--muted)}.status.error{color:#ff9191}.status.ok{color:#5ce69a}.spinner{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.2);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;margin-right:7px}@keyframes spin{to{transform:rotate(360deg)}}.success{display:none}.success .tv-icon{color:#5ce69a;border-color:rgba(92,230,154,.25);background:rgba(92,230,154,.08)}.help{margin-top:17px;font-size:12px;color:#758094;line-height:1.5}.tt-account-entry{display:none!important}@media(max-width:480px){body{padding:16px}.card{padding:24px 19px;border-radius:25px}h1{font-size:27px}}
    input.code{display:block;width:min(250px,100%);margin:22px auto 10px;color:#fff;text-align:center;outline:none}input.code:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,183,3,.12)}
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand"><img src="icons/icon-192.png" alt=""><span>Tube<em>TV</em></span></div>
    <section class="card" id="connect-card">
      <div class="tv-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="m8 2 4 3 4-3M8 22h8"/></svg></div>
      <h1>Collega questa TV</h1><p id="intro">Inserisci il codice mostrato sul televisore.</p><input class="code" id="pair-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" aria-label="Codice TV">
      <div class="account" id="account-box" hidden><strong id="account-name"></strong><small id="account-email"></small></div>
      <button class="button" id="resolve">Verifica codice TV</button><button class="button" id="confirm" hidden>Conferma collegamento</button><button class="button secondary" id="login" hidden>Accedi o registrati</button>
      <div class="status" id="status"><span class="spinner"></span>Controllo in corso</div><div class="help">Per sicurezza, questo telefono deve essere tra i dispositivi approvati dall’amministratore.</div>
    </section>
    <section class="card success" id="success-card"><div class="tv-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 12 4 4L19 6"/></svg></div><h1>TV collegata</h1><p>Il tuo account è ora attivo sulla TV. Troverai il telecomando TubeTV sul telefono.</p><button class="button secondary" onclick="location.href='index.html'">Torna a TubeTV</button></section>
  </main>
  <script>function getBasePath(){const p=location.pathname;return p.slice(0,p.lastIndexOf('/')+1)}</script><script src="account.js?v=16"></script>
  <script>
  (()=>{const $=id=>document.getElementById(id),base=getBasePath(),params=new URLSearchParams(location.search);let pair=params.get('pair')||'',code=params.get('code')||'',busy=false;$('pair-code').value=/^\d{6}$/.test(code)?code:'';
    const deviceId=()=>{let id=localStorage.getItem('tubetv_iptv_device_id')||'';if(!/^[a-z0-9_-]{24,96}$/.test(id)){const a=new Uint8Array(24);crypto.getRandomValues(a);id=Array.from(a,b=>b.toString(16).padStart(2,'0')).join('');localStorage.setItem('tubetv_iptv_device_id',id)}return id};
    async function request(action,method='GET',body=null){const url=new URL(base+'api/tv-pair.php',location.href);if(method==='GET'){url.searchParams.set('action',action);url.searchParams.set('pair',pair);url.searchParams.set('code',code)}const r=await fetch(url,{method,credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):null});const d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false){const e=new Error(d.error||'SERVER_ERROR');e.status=r.status;throw e}return d}
    function msg(text,kind=''){const n=$('status');n.className='status '+kind;n.textContent=text}
    function showTv(d){$('intro').textContent='Stai per autorizzare '+d.tv.name+' con questo account.';$('account-name').textContent=d.account.name;$('account-email').textContent=d.account.email;$('account-box').hidden=false;$('resolve').hidden=true;$('confirm').hidden=false;$('login').hidden=true;$('pair-code').readOnly=true;msg('Controlla i dati e conferma.')}
    async function resolveManual(){code=String($('pair-code').value||'').replace(/\D/g,'').slice(0,6);$('pair-code').value=code;if(!/^\d{6}$/.test(code)){msg('Inserisci le 6 cifre mostrate sulla TV.','error');return}msg('Verifico il codice…');try{const d=await request('resolve','POST',{action:'resolve',code});pair=d.pairId;showTv(d)}catch(e){if(e.status===401){$('intro').textContent='Accedi al tuo account per collegare la TV.';$('login').hidden=false;msg('Accesso richiesto.');return}msg(e.message==='TOO_MANY_ATTEMPTS'?'Troppi tentativi. Riprova tra 10 minuti.':'Codice errato o scaduto. Controlla lo schermo TV.','error')}}
    async function inspect(){if(!pair||!/^\d{6}$/.test(code)){msg('Inserisci manualmente il codice mostrato sulla TV.');$('resolve').hidden=false;return}try{showTv(await request('inspect'))}catch(e){if(e.status===401){$('intro').textContent='Accedi al tuo account TubeTV per autorizzare la TV.';$('login').hidden=false;msg('Accesso richiesto.');return}msg(e.message==='PAIR_INVALID_OR_EXPIRED'?'Il codice è scaduto. Generane uno nuovo sulla TV.':'Collegamento non disponibile.','error')}}
    $('resolve').addEventListener('click',resolveManual);$('pair-code').addEventListener('keydown',event=>{if(event.key==='Enter')resolveManual()});$('pair-code').addEventListener('input',event=>{event.target.value=event.target.value.replace(/\D/g,'').slice(0,6)});
    $('login').addEventListener('click',()=>window.TubeTVAccount?.openModal?.('login'));
    $('confirm').addEventListener('click',async()=>{if(busy)return;busy=true;$('confirm').disabled=true;$('confirm').textContent='Collegamento…';msg('Autorizzo la TV…');try{await request('claim','POST',{action:'claim',pairId:pair,code,mobileDeviceId:deviceId()});$('connect-card').style.display='none';$('success-card').style.display='block';window.TubeTVAccount?.refreshRemoteDevices?.()}catch(e){if(e.message==='TRUSTED_DEVICE_REQUIRED')msg('Questo telefono non è ancora approvato. Apri il catalogo IPTV, richiedi l’accesso e fallo approvare dall’admin, poi riprova.','error');else msg(e.message==='PAIR_INVALID_OR_EXPIRED'?'Codice scaduto: scansiona il nuovo QR sulla TV.':'Impossibile collegare la TV. Riprova.','error');$('confirm').disabled=false;$('confirm').textContent='Conferma collegamento'}finally{busy=false}});
    let attempts=0;const continuePairing=()=>pair?inspect():(/^\d{6}$/.test(String($('pair-code').value||''))?resolveManual():inspect());const wait=()=>{attempts++;if(window.TubeTVAccount&&!window.TubeTVAccount.getState().loading)continuePairing();else if(attempts<50)setTimeout(wait,120)};wait();window.addEventListener('focus',()=>setTimeout(continuePairing,150));window.addEventListener('tubetv:auth-changed',event=>{if(event.detail?.user)setTimeout(continuePairing,80)});
  })();
  </script>
</body></html>
