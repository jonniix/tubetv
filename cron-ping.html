<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>TubeTV Cron Ping</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#0a0a0f;color:#f5f5f7;margin:0;padding:24px}
    pre{white-space:pre-wrap;background:#111118;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:14px}
  </style>
</head>
<body>
  <h1>TubeTV Cron Ping attivo</h1>
  <pre id="log"></pre>

  <script>
    async function ping() {
      const el = document.getElementById('log');

      async function get(url) {
        const r = await fetch(url, {
          cache: 'no-store',
          headers: {
            'Cache-Control': 'no-store',
            'Pragma': 'no-cache'
          }
        });
        const txt = await r.text();
        return 'URL: ' + url + '\nHTTP ' + r.status + '\n' + txt.slice(0, 1200);
      }

      try {
        const ts = Date.now();
        const cron = await get('./api/bot-v3.php?cron=1&nosw=1&ts=' + ts);
        const status = await get('./api/bot-v3.php?action=status&nosw=1&ts=' + (ts + 1));

        el.textContent =
          new Date().toLocaleString() +
          '\n\n--- CRON PING ---\n' +
          cron +
          '\n\n--- STATUS DOPO PING ---\n' +
          status;
      } catch(e) {
        el.textContent = new Date().toLocaleString() + '\nERRORE: ' + e.message;
      }
    }

    ping();
    setInterval(ping, 60000);
  </script>
</body>
</html>
