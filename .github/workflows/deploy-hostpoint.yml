name: Deploy su Hostpoint

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: hostpoint-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.HOSTPOINT_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      HOSTPOINT_HOST: ${{ secrets.HOSTPOINT_HOST }}
      HOSTPOINT_USER: ${{ secrets.HOSTPOINT_USER }}
      HOSTPOINT_PORT: ${{ secrets.HOSTPOINT_PORT }}
      HOSTPOINT_PATH: ${{ secrets.HOSTPOINT_PATH }}
      HOSTPOINT_SSH_KEY: ${{ secrets.HOSTPOINT_SSH_KEY }}

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Controlla il codice pubblicabile
        shell: bash
        run: |
          set -Eeuo pipefail
          php schedule-engine-tests.php
          php multilive-tests.php
          node _official_bot_check.js
          node live-ui-tests.js
          node tv-experience-tests.js
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find api -type f -name '*.php' -print0)

      - name: Prepara il collegamento SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${HOSTPOINT_HOST:?Secret HOSTPOINT_HOST mancante}"
          : "${HOSTPOINT_USER:?Secret HOSTPOINT_USER mancante}"
          : "${HOSTPOINT_PATH:?Secret HOSTPOINT_PATH mancante}"
          : "${HOSTPOINT_SSH_KEY:?Secret HOSTPOINT_SSH_KEY mancante}"
          HOSTPOINT_PORT="${HOSTPOINT_PORT:-22}"
          echo "HOSTPOINT_PORT=$HOSTPOINT_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$HOSTPOINT_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/hostpoint_deploy"
          chmod 600 "$HOME/.ssh/hostpoint_deploy"
          ssh-keyscan -p "$HOSTPOINT_PORT" -H "$HOSTPOINT_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Pubblica l'applicazione
        shell: bash
        run: |
          set -Eeuo pipefail
          rsync -az --checksum --delete-delay --delete-excluded --itemize-changes \
            --filter='protect /.env' \
            --filter='protect /data/***' \
            --filter='protect /private/***' \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/.env' \
            --exclude='/.env.example' \
            --exclude='/data/' \
            --exclude='/private/' \
            --exclude='/node_modules/' \
            --exclude='/host-kit/' \
            --exclude='/host/' \
            --exclude='/desktop-host/' \
            --exclude='/desktop-worker/' \
            --exclude='/assets/vendor/hls.light.min.js' \
            --exclude='/assets/vendor/mpegts.js' \
            --exclude='/README.md' \
            --exclude='/package.json' \
            --exclude='/package-lock.json' \
            --exclude='/transform.py' \
            --exclude='/_*.js' \
            --exclude='/*-tests.php' \
            --exclude='/*-tests.js' \
            -e "ssh -i $HOME/.ssh/hostpoint_deploy -p $HOSTPOINT_PORT" \
            ./ "${HOSTPOINT_USER}@${HOSTPOINT_HOST}:${HOSTPOINT_PATH%/}/"

      - name: Rimuovi i dati privati IPTV dismessi
        shell: bash
        run: |
          set -Eeuo pipefail
          REMOTE_ROOT="${HOSTPOINT_PATH%/}"
          case "$REMOTE_ROOT" in ''|'/'|'.') echo 'Percorso Hostpoint non sicuro'; exit 1;; esac
          ssh -i "$HOME/.ssh/hostpoint_deploy" -p "$HOSTPOINT_PORT" "${HOSTPOINT_USER}@${HOSTPOINT_HOST}" \
            "cd -- '$REMOTE_ROOT' && test \"\$(pwd -P)\" != / && rm -rf -- \
              private/iptv-config.json \
              private/iptv-devices.json \
              private/iptv-rate-limit.json \
              private/iptv-host-secret \
              private/adaptive-takeover.json \
              private/iptv-sessions \
              private/iptv-logo-cache \
              private/iptv-segment-cache \
              private/iptv-playlist-cache \
              private/iptv-prefetch-queue \
              private/iptv-activity"

      - name: Riepilogo
        run: echo "TubeTV pubblicato su Hostpoint; data/, account e .env preservati, residui IPTV eliminati."
